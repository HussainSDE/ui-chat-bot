<div class="chat-page">
  <header class="chat-header">
    <div class="peer">
      <div class="avatar bot-avatar">🤖</div>
      <div class="peer-info">
        <span class="peer-name">Chat Bot</span>
        <span class="peer-status"><span class="status-dot"></span>Online</span>
      </div>
    </div>
    <button type="button" class="logout" (click)="logout()">Log out</button>
  </header>

  <div class="chat-messages">
    @if (messages().length === 0) {
      <div class="empty">
        <div class="empty-icon">💬</div>
        <p>Say something to get started.</p>
      </div>
    }

    @for (message of messages(); track $index) {
      <div class="message-row" [class.user]="message.sender === 'user'">
        @if (message.sender === 'bot') {
          <div class="avatar bot-avatar small">🤖</div>
        }
        <div class="bubble-group">
          <div class="bubble" [class.user]="message.sender === 'user'" [class.bot]="message.sender === 'bot'">
            {{ message.text }}
          </div>
          <span class="timestamp">{{ message.sentAt | date: 'shortTime' }}</span>
        </div>
      </div>
    }

    @if (isSending()) {
      <div class="message-row">
        <div class="avatar bot-avatar small">🤖</div>
        <div class="bubble-group">
          <div class="bubble bot typing">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        </div>
      </div>
    }

    <div #scrollAnchor></div>
  </div>

  <form class="chat-input" (ngSubmit)="sendMessage()" novalidate>
    <input
      type="text"
      name="draft"
      placeholder="Type a message..."
      [ngModel]="draft()"
      (ngModelChange)="draft.set($event)"
      [disabled]="isSending()"
    />
    <button type="submit" class="send-btn" [disabled]="isSending() || !draft().trim()" aria-label="Send message">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor" />
      </svg>
    </button>
  </form>
</div>
